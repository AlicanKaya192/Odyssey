name: Özellik önerisi
description: Eklenmesini istediğiniz bir şey mi var?
title: "[Öneri]: "
labels: ["öneri"]
body:
  - type: markdown
    attributes:
      value: |
        Öneriyi yazarken "ne eklensin"den çok **hangi sorunu çözdüğünü**
        anlatırsanız daha iyi bir çözüm bulabiliriz.

  - type: textarea
    id: sorun
    attributes:
      label: Hangi sorunu çözüyor?
      description: Bir öğrenci neyi yapamıyor, nerede tıkanıyor?
      placeholder: |
        Uzun bir dersin ortasında bıraktığımda, geri döndüğümde
        nerede kaldığımı bulamıyorum.
    validations:
      required: true

  - type: textarea
    id: cozum
    attributes:
      label: Aklınızdaki çözüm
      description: Bir fikriniz varsa yazın. Zorunlu değil.

  - type: dropdown
    id: alan
    attributes:
      label: Hangi bölümle ilgili?
      options:
        - Öğrenme yolu
        - Konu anlatımı ve ders notları
        - Sınav
        - Alıştırmalar ve kod çalıştırma
        - Profil ve ilerleme
        - Arayüz ve tasarım
        - Çeviri
        - İçerik (yeni bölüm, alıştırma)
        - Diğer
    validations:
      required: true

  - type: checkboxes
    id: kontroller
    attributes:
      label: Kontroller
      options:
        - label: Aynı öneriyi içeren başka bir issue olmadığına baktım.
          required: true
        - label: "Bunun yol haritasında olup olmadığını CHANGELOG.md'den kontrol ettim."
          required: false

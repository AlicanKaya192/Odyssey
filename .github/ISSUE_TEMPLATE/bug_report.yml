name: Hata bildirimi
description: Çalışmayan bir şey buldunuz mu?
title: "[Hata]: "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: |
        Bildirim için teşekkürler. Aşağıdakileri doldurursanız sorunu çok
        daha hızlı bulabilirim.

  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Ne yapmaya çalıştınız, ne bekliyordunuz, ne oldu?
      placeholder: |
        Ders notları sekmesine geçtim, ayrı bir pencere açıldı.
        Beklediğim, notun aynı pencerede açılmasıydı.
    validations:
      required: true

  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      description: Adım adım yazarsanız birebir deneyebilirim.
      placeholder: |
        1. Uygulamayı aç
        2. Python Temelleri modülüne gir
        3. "Değişkenler ve Veri Tipleri" bölümünü aç
        4. Üstteki "Ders Notu" sekmesine tıkla
    validations:
      required: true

  - type: input
    id: surum
    attributes:
      label: Uygulama sürümü
      description: Lisans ekranının en altında yazıyor.
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: ortam
    attributes:
      label: Windows ve Python sürümü
      description: "`python --version` çıktısı ve Windows sürümünüz."
      placeholder: "Windows 11 · Python 3.14.2"
    validations:
      required: true

  - type: textarea
    id: hata-metni
    attributes:
      label: Hata metni
      description: Terminalde bir hata çıktıysa buraya yapıştırın.
      render: text

  - type: textarea
    id: gorsel
    attributes:
      label: Ekran görüntüsü
      description: Görsel varsa buraya sürükleyip bırakabilirsiniz.

  - type: checkboxes
    id: kontroller
    attributes:
      label: Kontroller
      options:
        - label: Aynı sorunu bildiren başka bir issue olmadığına baktım.
          required: true
        - label: Sanal ortamı Anaconda ile değil, temiz bir CPython ile kurdum.
          required: false

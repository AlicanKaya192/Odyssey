name: Hata bildirimi
description: Çalışmayan bir şey buldunuz mu?
title: "[Hata]: "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: |
        Bildirim için teşekkürler. Aşağıdakileri doldurursanız sorunu çok
        daha hızlı bulabilirim.

  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Ne yapmaya çalıştınız, ne bekliyordunuz, ne oldu?
      placeholder: |
        Ders notları sekmesine geçtim, ayrı bir pencere açıldı.
        Beklediğim, notun aynı pencerede açılmasıydı.
    validations:
      required: true

  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      description: Adım adım yazarsanız birebir deneyebilirim.
      placeholder: |
        1. Uygulamayı aç
        2. Python Temelleri modülüne gir
        3. "Değişkenler ve Veri Tipleri" bölümünü aç
        4. Üstteki "Ders Notu" sekmesine tıkla
    validations:
      required: true

  - type: input
    id: surum
    attributes:
      label: Uygulama sürümü
      description: Programın alt şeridinde ve Ayarlar penceresinin sol altında yazıyor.
      placeholder: "0.9.2"
    validations:
      required: true

  - type: input
    id: ortam
    attributes:
      label: Windows sürümü
      description: "Kaynak koddan çalıştırıyorsanız `python --version` çıktısını da ekleyin."
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: hata-metni
    attributes:
      label: Hata metni
      description: Terminalde bir hata çıktıysa buraya yapıştırın.
      render: text

  - type: textarea
    id: gunluk
    attributes:
      label: Günlük dosyası (0.9.2 ve sonrası)
      description: |
        `%APPDATA%\Odyssey\logs\odyssey.log` dosyasını buraya sürükleyin ya da
        içeriğini yapıştırın. Dosyada yazdığınız kod, notlarınız ya da
        cevaplarınız yer almıyor.
      render: text

  - type: textarea
    id: gorsel
    attributes:
      label: Ekran görüntüsü
      description: Görsel varsa buraya sürükleyip bırakabilirsiniz.

  - type: checkboxes
    id: kontroller
    attributes:
      label: Kontroller
      options:
        - label: Aynı sorunu bildiren başka bir issue olmadığına baktım.
          required: true
        - label: Kaynak koddan çalıştırıyorsam sanal ortamı Anaconda ile değil, temiz bir CPython ile kurdum.
          required: false

name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    # Write the job's env section here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
